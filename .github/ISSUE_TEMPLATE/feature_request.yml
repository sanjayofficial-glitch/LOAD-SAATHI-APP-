name: Feature Request
description: Suggest a new feature or improvement for LoadSaathi
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for LoadSaathi!
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Be specific.
      placeholder: "As a [shipper/trucker], I want to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your proposed feature or improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative approaches
      description: What alternatives have you considered?
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How would this benefit shippers and/or truckers?
