name: CI

on:
  push:
    branches: [main, develop, 'seo/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # `pnpm build` is vite build + prerender (179 routes) + smoke tests. That
    # overruns 15 minutes on a 2-core runner; the Build step was being
    # cancelled at the timeout while every earlier step passed.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` here on purpose. package.json pins
        # packageManager, and pnpm/action-setup fails with "Multiple versions
        # of pnpm specified" if both places declare one. Letting the action
        # read packageManager keeps a single source of truth.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7
